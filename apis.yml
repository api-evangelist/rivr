name: RIVR
description: >-
  RIVR (RIVR Technologies AG, formerly Swiss-Mile) is a Swiss robotics and AI
  company spun out of ETH Zurich that develops autonomous legged-wheeled robots
  for doorstep delivery across parcel, grocery, and instant food/convenience
  segments. RIVR pursues "General Physical AI" by combining large-scale
  reinforcement learning in simulation with real-world self-supervised learning
  from live delivery operations, owning the full stack from software to hardware
  for reliability, safety, and cost efficiency. The company operates commercial
  deployments with partners including Just Eat Takeaway.com, Swiss Post, Migros
  Online, Evri, and Veho, and is backed by investors including Hongshan and
  Bezos Expeditions. This profile is maintained as an API Evangelist network
  company record; RIVR publishes no public developer API surface at this time.
